[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gflvn"
version = "0.1.0"
description = "Girls' Frontline story scripts (avgtxt) -> portable VN intermediate representation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gflvn-parse = "gflvn.avgtxt:main"

[tool.setuptools.packages.find]
where = ["src"]

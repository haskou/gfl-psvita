[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gflvn"
version = "0.11.0"
description = "Girls' Frontline story scripts (avgtxt) -> portable VN intermediate representation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/haskou/gfl-psvita"
Issues = "https://github.com/haskou/gfl-psvita/issues"

[project.scripts]
gflvn-parse = "gflvn.avgtxt:main"

[tool.setuptools.packages.find]
where = ["src"]
